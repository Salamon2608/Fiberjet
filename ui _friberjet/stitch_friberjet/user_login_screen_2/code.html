<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fiber Jet Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9b515",
                        "navy": "#0A2540",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231d0f",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom Circuit Pattern Background */
        .circuit-pattern {
            background-color: #ffffff;
            opacity: 1;
            background-image:  linear-gradient(#f1f1f1 1px, transparent 1px), linear-gradient(to right, #f1f1f1 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .dark .circuit-pattern {
            background-color: #231d0f;
            background-image:  linear-gradient(#2d2616 1px, transparent 1px), linear-gradient(to right, #2d2616 1px, transparent 1px);
        }

        /* Subtle tech overlay */
        .tech-overlay {
            background: radial-gradient(circle at 50% 0%, rgba(249, 181, 21, 0.05) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-navy dark:text-gray-100 antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Pattern -->
<div class="absolute inset-0 z-0 pointer-events-none circuit-pattern"></div>
<div class="absolute inset-0 z-0 pointer-events-none tech-overlay"></div>
<!-- Top App Bar / Header -->
<header class="relative z-10 w-full bg-navy text-white shadow-md">
<!-- Safe Area Top Spacer (simulated) -->
<div class="h-10 w-full"></div>
<div class="flex items-center justify-between px-4 py-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<div class="flex items-center justify-center size-8 rounded bg-primary text-navy">
<span class="material-symbols-outlined text-xl">bolt</span>
</div>
<h2 class="text-xl font-bold tracking-tight">Fiber Jet</h2>
</div>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">help</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="relative z-10 flex-1 flex flex-col px-6 pt-8 pb-6 w-full max-w-md mx-auto">
<!-- Welcome Message -->
<div class="mb-10 text-center">
<h1 class="text-3xl md:text-4xl font-bold text-navy dark:text-white mb-2 tracking-tight">Welcome Back</h1>
<p class="text-gray-500 dark:text-gray-400 font-medium">Manage your hyper-speed connection.</p>
</div>
<!-- Phone Input Form -->
<form class="space-y-6">
<div class="space-y-4">
<label class="block">
<span class="text-sm font-bold text-navy dark:text-gray-200 mb-2 block ml-2">Phone Number</span>
<div class="flex gap-3">
<!-- Country Code Picker -->
<div class="relative w-28">
<select class="w-full h-14 pl-3 pr-8 bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-xl text-lg font-medium text-navy dark:text-white focus:ring-2 focus:ring-primary focus:border-primary appearance-none cursor-pointer shadow-sm transition-all">
<option value="US">+1 🇺🇸</option>
<option value="UK">+44 🇬🇧</option>
<option value="CA">+1 🇨🇦</option>
<option value="AU">+61 🇦🇺</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none text-gray-500">
<span class="material-symbols-outlined text-xl">arrow_drop_down</span>
</div>
</div>
<!-- Phone Number Input -->
<div class="relative flex-1">
<input class="w-full h-14 px-4 bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-xl text-lg font-medium text-navy dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-primary shadow-sm outline-none transition-all" placeholder="000-000-0000" type="tel"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-[20px]">smartphone</span>
</div>
</div>
</div>
</label>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary hover:bg-[#e0a212] active:scale-[0.98] text-navy font-bold text-lg rounded-full shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all" type="button">
<span>Send OTP</span>
<span class="material-symbols-outlined text-xl">send</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex py-8 items-center">
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 dark:text-gray-500 text-sm font-medium">Or continue with</span>
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 hover:bg-gray-50 dark:hover:bg-white/10 active:bg-gray-100 text-navy dark:text-white font-medium text-base rounded-full flex items-center justify-center gap-3 transition-all shadow-sm">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer -->
<div class="mt-auto pt-8 flex flex-col items-center justify-center gap-4">
<p class="text-xs text-center text-gray-400 dark:text-gray-500">
                By continuing, you agree to our 
                <a class="text-navy dark:text-primary font-bold hover:underline" href="#">Terms of Service</a> 
                and 
                <a class="text-navy dark:text-primary font-bold hover:underline" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Decorative bottom tech line -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-navy via-primary to-navy opacity-50"></div>
</body></html>
