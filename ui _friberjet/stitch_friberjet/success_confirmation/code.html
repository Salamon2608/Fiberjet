</div>

<h1 class="text-slate-900 dark:text-white text-4xl font-bold leading-tight tracking-tight mb-3">

<p class="text-slate-600 dark:text-slate-400 text-lg leading-relaxed mb-6">

</div>
</div>
<p class="text-[11px] text-slate-400 dark:text-slate-500 mt-3 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-xs">info</span>
                    Reference ID: #FJ-88291 • Confirmation sent via email
