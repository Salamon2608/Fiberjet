<div class="text-center mb-8">

<button class="w-full bg-primary hover:bg-primary/90 text-navy-deep font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
